{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>{{ page_title|default:"Koozy — Make learning play" }}</title>
    <link rel="icon" type="image/png" href="{% static 'quiz/favicon/favicon-96x96.png' %}" sizes="96x96">
    <link rel="icon" type="image/svg+xml" href="{% static 'quiz/favicon/favicon.svg' %}">
    <link rel="shortcut icon" href="{% static 'quiz/favicon/favicon.ico' %}">
    <link rel="apple-touch-icon" sizes="180x180" href="{% static 'quiz/favicon/apple-touch-icon.png' %}">
    <meta name="apple-mobile-web-app-title" content="Koozy">
    <link rel="manifest" href="{% static 'quiz/favicon/site.webmanifest' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&family=Patrick+Hand&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'quiz/dist/assets/bundle.css' %}?v=1.5">
</head>
<body class="bg-[#f7f5ef] text-[#191817] min-h-screen">
    <div id="root"></div>
    {% if form_errors %}
    <div id="django-form-errors" style="display:none">{{ form_errors }}</div>
    {% endif %}

    <script id="koozy-config" type="application/json">
        {{ config_json|safe|default:"{}" }}
    </script>
    <script>
        try {
            window.__KOOZY_CONFIG__ = JSON.parse(document.getElementById('koozy-config').textContent || '{}');
        } catch (e) {
            window.__KOOZY_CONFIG__ = {};
        }
        window.__KOOZY_CONFIG__.csrfToken = "{{ csrf_token }}";
    </script>
    <script type="module" src="{% static 'quiz/dist/assets/bundle.js' %}?v=1.5"></script>
</body>
</html>
