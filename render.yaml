databases:
  - name: koozy-db
    databaseName: koozydb
    user: koozy
    plan: free
    postgresMajorVersion: "16"

services:
  - type: keyvalue
    name: koozy-redis
    plan: free
    ipAllowList: []

  - type: web
    name: koozy-backend
    runtime: python
    plan: free
    buildCommand: chmod +x ./render_build.sh && ./render_build.sh
    startCommand: cd backend && daphne -b 0.0.0.0 -p $PORT config.asgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "koozy.live,www.koozy.live,.onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://koozy.live,https://www.koozy.live"
      - key: GOOGLE_REDIRECT_URI
        value: "https://koozy.live/auth/google/callback/"
      - key: DATABASE_URL
        fromDatabase:
          name: koozy-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: koozy-redis
          property: connectionString
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: "gemini-3.8-flash"
      - key: SESSION_COOKIE_DOMAIN
        value: ".koozy.live"
      - key: CSRF_COOKIE_DOMAIN
        value: ".koozy.live"
